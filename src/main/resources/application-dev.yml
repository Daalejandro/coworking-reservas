
#Base de datos
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/coworking
    username: postgres
    password: 123456

#Jpa
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: false

#Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

#Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - circuitbreakers
          - circuitbreakerevents

  endpoint:
    health:
      show-details: always

  health:
    circuitbreakers:
      enabled: true

#Resilience
resilience4j:
  circuitbreaker:
    instances:
      items:
        register-health-indicator: true

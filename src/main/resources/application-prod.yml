

#Base de datos

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  #Jpa
  jpa:
    show-sql: false


#Swagger

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


#Actuator
management:
  endpoints:
    web:
      exposure:
        exclude: "*"

  endpoint:
    health:
      show-details: never

  health:
    circuitbreakers:
      enabled: false

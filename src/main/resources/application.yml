
spring:
  application:
    name: coworking-reservas

  profiles:
    default: dev


#cache
  cache:
    type: simple
    cache-names:
      - ocupacion
#jpa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

#servidor
server:
  port: 8080


# Resilience

resilience4j:
  circuitbreaker:
    configs:
      defecto:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 4
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50

    instances:
      items:
        base-config: defecto

  timelimiter:
    configs:
      defecto:
        timeout-duration: 3s

    instances:
      items:
        base-config: defecto

      

 
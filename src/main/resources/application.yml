spring:
  application:
    name: coworking-reservas
  profiles:
    default: dev
  cache:
    type: simple
    cache-names:
      - ocupacion
    
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - circuitbreakers
          - circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      defecto:
        sliding-window-size: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 4
        slow-call-duration-threshold: 3s  
        slow-call-rate-threshold: 50
    instances:
      items:
        base-config: defecto
  timelimiter:
    configs:
      defecto:
        timeout-duration: 3s
    instances:
      items:
        base-config: defecto
       
      

 